# The stack's single entry point (the `edge` image, see Dockerfile). It only
# routes; the apps run on Kestrel:
#
#   Cloudflare --tunnel--> cloudflared --> edge:80
#     <domain>/identity/*  -> identity:8080 (prefix kept: PathBase=/identity)
#     <domain>/*           -> api:8080      (REST API, /swagger, SignalR hub, Angular SPA)
#     <tool>.<domain>      -> the ops tools (tools.conf, behind basic auth)
#
# One origin for SPA, API and IdentityServer = no CORS, first-party cookies.

# Docker's embedded DNS. Upstreams are resolved per request (proxy_pass with a
# variable), so a redeployed container with a new IP is picked up at once, and
# nginx starts even when an upstream (e.g. an ops tool) isn't running.
resolver 127.0.0.11 valid=10s ipv6=off;

# Cloudflare terminates TLS and says so in X-Forwarded-Proto: pass it on as is.
# Direct requests (no header, e.g. curl 127.0.0.1:8088 on the server) are http.
map $http_x_forwarded_proto $edge_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# WebSocket upgrade (SignalR, MQTT, Grafana live); otherwise an empty
# Connection header (keep-alive).
map $http_upgrade $edge_connection {
    default upgrade;
    ''      '';
}

# The application: any host name that isn't an ops tool (tools.conf).
server {
    listen 80 default_server;
    server_name _;

    include /etc/nginx/medguard/common.inc;

    set $api_upstream      http://api:8080;
    set $identity_upstream http://identity:8080;

    location = /identity {
        return 301 /identity/;
    }

    location /identity/ {
        proxy_pass $identity_upstream;
    }

    # SignalR: WebSockets / long polling stay open for a long time.
    location /hubs/ {
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        proxy_pass $api_upstream;
    }

    location / {
        proxy_pass $api_upstream;
    }
}

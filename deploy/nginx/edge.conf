# The stack's single entry point (the `edge` image, see Dockerfile). It only
# routes; both apps run on Kestrel:
#
#   Cloudflare --tunnel--> cloudflared --> edge:80
#                                            /identity/*  -> identity:8080 (prefix kept: PathBase=/identity)
#                                            /*           -> api:8080      (REST API, SignalR hub, Angular SPA)
#
# One origin for SPA, API and IdentityServer = no CORS, first-party cookies.

# Docker's embedded DNS. Upstreams are resolved per request (proxy_pass with a
# variable), so a redeployed container with a new IP is picked up at once and
# nginx starts even before the apps exist.
resolver 127.0.0.11 valid=10s ipv6=off;

# Cloudflare terminates TLS and says so in X-Forwarded-Proto: pass it on as is.
# Direct requests (no header, e.g. curl 127.0.0.1:8088 on the server) are http.
map $http_x_forwarded_proto $edge_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# WebSocket upgrade for SignalR; otherwise an empty Connection header (keep-alive).
map $http_upgrade $edge_connection {
    default upgrade;
    ''      '';
}

server {
    listen 80 default_server;
    server_name _;

    # Visitors who arrived over plain http at Cloudflare are sent to https.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # nginx's own redirects (/identity -> /identity/) stay relative: an absolute
    # one would use this server's scheme (http), not the visitor's (https).
    absolute_redirect off;

    client_max_body_size 20m;

    # IdentityServer's cookies and redirect headers outgrow nginx's 4k/8k default
    # ("upstream sent too big header" -> 502 right after login).
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Headers live HERE only: a proxy_set_header inside a location would silently
    # drop every one inherited from this level.
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $edge_forwarded_proto;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $edge_connection;

    set $api_upstream      http://api:8080;
    set $identity_upstream http://identity:8080;

    location = /identity {
        return 301 /identity/;
    }

    location /identity/ {
        proxy_pass $identity_upstream;
    }

    # SignalR: WebSockets / long polling stay open for a long time.
    location /hubs/ {
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        proxy_pass $api_upstream;
    }

    location / {
        proxy_pass $api_upstream;
    }
}

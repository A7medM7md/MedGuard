# Ops tools, one sub-domain each, matched on the first label so the domain
# itself is never hard-coded (grafana.medguard.dpdns.org, grafana.localhost, ...).
# All of them sit behind basic auth (tools-auth.inc). The containers run in the
# "ops" compose profile; when they don't, these hosts answer 502.

# Grafana: dashboards. Signs the basic-auth user straight in (auth proxy), so
# there is one login, not two.
server {
    listen 80;
    server_name ~^grafana\.;
    include /etc/nginx/medguard/common.inc;
    include /etc/nginx/medguard/tools-auth.inc;
    # Set here, never from the client: Grafana trusts this header (auth.proxy).
    proxy_set_header X-WEBAUTH-USER $remote_user;
    set $upstream http://grafana:3000;
    location / { proxy_pass $upstream; }
}

# Kafka UI: topics, partitions, messages, consumer-group lag.
server {
    listen 80;
    server_name ~^kafka\.;
    include /etc/nginx/medguard/common.inc;
    include /etc/nginx/medguard/tools-auth.inc;
    set $upstream http://kafka-ui:8080;
    location / { proxy_pass $upstream; }
}

# HiveMQ: an MQTT web client at /, and the broker's MQTT-over-WebSocket
# listener at /mqtt (wss://hivemq.<domain>/mqtt), for browser and device clients.
server {
    listen 80;
    server_name ~^(hivemq|mqtt)\.;
    include /etc/nginx/medguard/common.inc;
    include /etc/nginx/medguard/tools-auth.inc;
    set $broker http://hivemq:8000;
    set $client http://mqtt-web:80;
    location /mqtt {
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        proxy_pass $broker;
    }
    location / { proxy_pass $client; }
}

# Seq: structured logs and traces of every service.
server {
    listen 80;
    server_name ~^(seq|logs)\.;
    include /etc/nginx/medguard/common.inc;
    include /etc/nginx/medguard/tools-auth.inc;
    set $upstream http://seq:80;
    location / { proxy_pass $upstream; }
}

# Prometheus: raw metrics and queries.
server {
    listen 80;
    server_name ~^prometheus\.;
    include /etc/nginx/medguard/common.inc;
    include /etc/nginx/medguard/tools-auth.inc;
    set $upstream http://prometheus:9090;
    location / { proxy_pass $upstream; }
}

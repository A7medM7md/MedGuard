<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MedGuard — Cold-Chain Control</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/x-icon" href="medguard-logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <script>
    // Apply the saved theme before first paint (AppShell owns the toggle), so the
    // splash below and the app never flash the wrong theme.
    try {
      var t = localStorage.getItem('medguard-theme');
      if (t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');
    } catch (e) {}
  </script>
  <style>
    /*
     * Startup splash. Painted from this file alone, before any JavaScript loads,
     * and kept up by AppComponent (same classes) while sign-in is checked and the
     * browser is redirected to IdentityServer — so a visitor never sees a blank page.
     */
    .mg-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      padding: 24px; text-align: center;
      background: #f1f5f9; color: #0f172a;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .dark .mg-splash { background: #0b1220; color: #f1f5f9; }
    .mg-splash-logo { width: 64px; height: 64px; animation: mg-splash-breathe 2.4s ease-in-out infinite; }
    .mg-splash-title { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
    .mg-splash-sub {
      margin: 4px 0 0; font-size: 10px; font-weight: 600; letter-spacing: 0.14em; color: #64748b;
      font-family: "JetBrains Mono", ui-monospace, monospace;
    }
    .mg-splash-bar { position: relative; width: 180px; height: 3px; overflow: hidden; border-radius: 999px; background: rgba(15, 106, 166, 0.15); }
    .mg-splash-bar::after {
      content: ""; position: absolute; inset: 0; width: 40%; border-radius: 999px; background: #0f6aa6;
      animation: mg-splash-slide 1.2s ease-in-out infinite;
    }
    .dark .mg-splash-bar { background: rgba(59, 143, 208, 0.2); }
    .dark .mg-splash-bar::after { background: #3b8fd0; }
    .mg-splash-status { margin: 0; min-height: 18px; font-size: 13px; font-weight: 500; }
    .mg-splash-hint {
      margin: 0; max-width: 340px; font-size: 12px; line-height: 1.5; color: #64748b;
      opacity: 0; animation: mg-splash-fade 0.4s ease forwards 4s;
    }
    .mg-splash-error { color: #dc2626; }
    .mg-splash-button {
      padding: 8px 16px; border: 0; border-radius: 6px; cursor: pointer;
      background: #0f6aa6; color: #fff; font: 600 13px Inter, ui-sans-serif, system-ui, sans-serif;
    }
    .mg-splash-button:focus-visible { outline: 2px solid #3b8fd0; outline-offset: 2px; }
    @keyframes mg-splash-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    @keyframes mg-splash-fade { to { opacity: 1; } }
    @keyframes mg-splash-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    @media (prefers-reduced-motion: reduce) {
      .mg-splash-logo, .mg-splash-bar::after { animation: none; }
      .mg-splash-hint { animation-duration: 0s; }
    }
  </style>
</head>
<body>
  <mg-root>
    <div class="mg-splash" role="status" aria-live="polite">
      <img class="mg-splash-logo" src="medguard-logo.svg" alt="" />
      <div>
        <p class="mg-splash-title">MedGuard</p>
        <p class="mg-splash-sub">COLD-CHAIN CONTROL</p>
      </div>
      <div class="mg-splash-bar" aria-hidden="true"></div>
      <p class="mg-splash-status">Starting MedGuard…</p>
      <p class="mg-splash-hint">Connecting to the secure sign-in server. The demo runs on free hosting, so the first visit can take a few seconds.</p>
    </div>
    <script>
      // Back from the login page with an authorization code: say so already.
      if (/[?&]code=/.test(location.search)) document.querySelector('.mg-splash-status').textContent = 'Signing you in…';
    </script>
  </mg-root>
</body>
</html>
